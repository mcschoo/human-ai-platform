[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "human-ai-control-plane"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<10"]

[tool.setuptools.packages.find]
include = ["control_plane*"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["live: requires CONTROL_PLANE_LIVE_TESTS=1 and a running vLLM"]
