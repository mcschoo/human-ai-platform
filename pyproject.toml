[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "human-ai-platform-validation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.66,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: requires HAI_LIVE_TESTS=1 and a running OpenAI-compatible server",
  "admin: exercises an optional authenticated admin endpoint",
]

[tool.ruff]
line-length = 88
target-version = "py310"
