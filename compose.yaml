name: human-ai-platform

services:
  vllm:
    image: vllm/vllm-openai:v0.28.0@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set --
        if [ -n "$${QUANTIZATION:-}" ]; then
          set -- --quantization "$${QUANTIZATION}"
        fi
        exec vllm serve "$${MODEL_ID}" \
          --revision "$${MODEL_REVISION}" \
          --host 0.0.0.0 \
          --port 8000 \
          --served-model-name "$${SERVED_MODEL_NAME}" \
          --dtype "$${DTYPE}" \
          --max-model-len "$${MAX_MODEL_LEN}" \
          --tensor-parallel-size "$${TENSOR_PARALLEL_SIZE}" \
          --gpu-memory-utilization "$${GPU_MEMORY_UTILIZATION}" \
          --generation-config vllm \
          --default-chat-template-kwargs "$${DEFAULT_CHAT_TEMPLATE_KWARGS}" \
          --enable-prefix-caching \
          --enable-chunked-prefill \
          --reasoning-parser qwen3 \
          --language-model-only \
          "$$@"
    env_file:
      - path: ./config/models/${MODEL_PROFILE:-qwen3.5-9b-bf16}.env
        required: true
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${VLLM_API_KEY:?Set VLLM_API_KEY in .env}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    expose:
      - "8000"
    networks:
      - model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-8080}:8080"
      - "127.0.0.1:${ADMIN_PORT:-2019}:2019"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:8080}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - public
      - model
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  control-plane:
    build:
      context: ./services/control-plane
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-8090}:8090"
    environment:
      CONTROL_PLANE_DB: /data/control-plane.db
      CONTROL_PLANE_OPERATOR_PASSWORD: ${CONTROL_PLANE_OPERATOR_PASSWORD:-change-me}
      CONTROL_PLANE_COOKIE_SECRET: ${CONTROL_PLANE_COOKIE_SECRET:-change-me-cookie}
      CONTROL_PLANE_VLLM_URL: http://vllm:8000/v1
      CONTROL_PLANE_MODEL: ${CONTROL_PLANE_MODEL:-qwen3.5-9b}
      VLLM_API_KEY: ${VLLM_API_KEY:?Set VLLM_API_KEY in .env}
    volumes:
      - control-plane-data:/data
    networks:
      - public
      - model
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  public:
  model:
    internal: true

volumes:
  hf-cache:
  caddy-data:
  caddy-config:
  control-plane-data:
